# ==============================================================================
# llama-swap — NODE 2 (gx10-02, compute node, user legenex-02)
# ==============================================================================
# Role: MODEL PROCESS LIFECYCLE ONLY, same contract as node01.yaml.
#
# Managed here: gx-reason (heavy tier).
# Reserved here: the ComfyUI / media tier that backs gx-image and gx-video.
#                That router is being specified by ANOTHER AGENT; this file only
#                reserves its memory budget and leaves a commented scaffold.
#
# NOT managed here: gx-max rank1. The SGLang distributed job is owned by the
# lead's orchestrator. llama-swap must never start, stop or health-check it.
#
# ------------------------------------------------------------------------------
# MEMORY BUDGET — NODE 2 (hard rule)
# ------------------------------------------------------------------------------
# Node 2 is a SEPARATE 128 GB (~121 GiB) unified-memory system. It is NOT part of
# a coherent 256 GB pool with node 1. CPU and GPU allocations compete for the
# same bytes.
#
#   heavy tier (group "heavy")   <= 45 GB   (exactly ONE member at a time)
#   media tier (group "media")   <= 22 GB   (ComfyUI / gx-image / gx-video)
#   --------------------------------------------
#   ceiling                      ~67 GB     -> >= 54 GB headroom
#
# heavy-tier ceiling lowered 78 -> 45 GB on 2026-09-15: gx-reason was
# replaced (B-011, see the gx-reason macro block below) from a ~95 GiB GGUF/
# llama.cpp checkpoint to a ~22 GiB safetensors/vLLM one. Headroom is now far
# more generous than the original design assumed.
#
# Structural enforcement:
#   * "heavy" has swap: true  -> at most one heavy model is ever loaded.
#   * gx-reason pins --gpu-memory-utilization (${gx_reason_gpu_fraction}); it is
#     not adaptive, so its footprint cannot drift upward.
#   * "media" is persistent + non-exclusive so image/video work is not evicted by
#     a text request and does not evict gx-reason.
#
# WHILE gx-max IS RUNNING: rank1 holds ~93 GiB on this node. NOTHING in this file
# may be loaded during a gx-max job. llama-swap is on-demand only and has no
# preload, so simply not sending requests is sufficient; the lead's orchestrator
# is the component that enforces acquisition/drain.
#
# ------------------------------------------------------------------------------
# GPU ACCESS
# ------------------------------------------------------------------------------
# Use CDI (--device nvidia.com/gpu=all), matching node 1 and the live
# gx-max-rank1 container. VERIFY on node 2 before first start:
#     docker info --format '{{json .Runtimes}}'    # expect runc only
#     ls /var/run/cdi                              # expect nvidia.yaml
# If node 2 does have an `nvidia` runtime registered, CDI still works; do not
# switch to --runtime nvidia without checking.
#
# ------------------------------------------------------------------------------
# REACHABILITY FROM NODE 1  (required for gx-reason to work)
# ------------------------------------------------------------------------------
# LiteLLM on node 1 calls this instance at:
#     http://192.168.100.11:28080/v1        (ConnectX/RoCE fabric A)
# So node 2's llama-swap service MUST publish 8080 on the FABRIC address:
#     ports: ["192.168.100.11:28080:8080"]
# NEVER publish it on the Tailscale interface: management traffic only there,
# model traffic only on the fabric.
#
# ------------------------------------------------------------------------------
# SCHEMA NOTE
# ------------------------------------------------------------------------------
# Targets the current llama-swap schema (`routing.router.settings.groups`).
# If the deployed binary rejects `routing:`, delete that whole section — the
# default one-model-at-a-time behaviour is strictly more conservative.
# Validate without starting anything:  llama-swap -config node02.yaml -validate
#   (verified against gx-llama-swap:latest's own --help, 2026-09-16; there is
#    no -dry-run flag)
# ==============================================================================

# Cold start on unified memory is slow (weight load, FlashInfer autotune, CUDA
# graph capture). MEASURED 2026-09-16 for the current 27B NVFP4 checkpoint:
# 401 s from request to first token (~225 s of it weight loading at ~75 s per
# 10 GiB shard, 177 s of engine init/profile/warmup incl. 31 s compilation).
# 2400 s therefore leaves a ~6x margin; it is deliberately not tightened to the
# measurement, because a cold page cache after a reboot is slower than this run.
healthCheckTimeout: 2400

logLevel: debug
logTimeFormat: rfc3339
logToStdout: both   # D-039: keep vLLM start-up output (a failed start must leave evidence)
metricsMaxInMemory: 1000
captureBuffer: 0

startPort: 25800
globalTTL: 0
unloadTimeout: 240
globalConcurrencyLimit: 8

sendLoadingState: false
includeAliasesInList: false

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------
# This instance IS network-exposed (on the fabric), so the bearer token is not
# optional. Value comes from the environment ONLY. Unset -> llama-swap refuses to
# start. Use the SAME value as node 1 so LiteLLM needs one credential.
apiKeys:
  - "${env.GX_SWAP_API_KEY}"

# ------------------------------------------------------------------------------
# MACROS
# ------------------------------------------------------------------------------
macros:
  llamacpp_image: "legenex/llama-cpp-spark:latest"  # superseded for gx-reason (B-011); kept for any future llama.cpp use on this node
  vllm_image: "jstarkg/vllm-gb10-flashnext:0.28-sm121-r6"  # same image as node1's gx-fast
  host: "0.0.0.0"

  # Host-side model root on node 2 (see coordination/node2/NODE2_STATE.md).
  models_root: "/srv/models"
  # D-039: persistent torch.compile / Triton / FlashInfer JIT caches, one
  # directory per model. The model containers run with --rm, so without this
  # every cold start recompiled (gx-reason: ~32 s compile + ~53 s warmup).
  # vLLM keys its caches by config and code hash, so a new image or flag set
  # never reuses a stale entry. Files are written by the container (root);
  # clear them with `docker run --rm -v <dir>:/c alpine sh -c 'rm -rf /c/*'`.
  vllm_cache_root: "/srv/projects/gx-cluster/runtime/vllm-cache"

  # Must match container_name of node 2's llama-swap service.
  swap_netns: "container:gx-llama-swap-node02"

  # ---- gx-reason: REPLACED 2026-09-15, see coordination/BLOCKERS.md B-011 ----
  # The previous Qwen3.5-122B-A10B GGUF/llama.cpp combination is CONFIRMED
  # BROKEN: real, reproducible GARBAGE output on this llama.cpp build's CUDA
  # path for the qwen3_5_moe hybrid (linear-attention/GDN) architecture --
  # ruled out as a checkpoint/quant problem (CPU-only path with the identical
  # weights is coherent) and ruled out as a stale-build problem (rebuilt from
  # current upstream llama.cpp master, byte-identical garbage). See B-011 for
  # the full evidence trail. That llama.cpp build is REJECTED for this tier;
  # do not re-attempt the same engine/architecture combination.
  #
  # Replacement: nvidia/Qwen3.6-27B-NVFP4 on vLLM, using the SAME proven
  # engine image/driver combination already verified working on THIS hardware
  # for gx-fast (nvidia/Qwen3.6-35B-A3B-NVFP4). config.json for the new
  # checkpoint shows the identical qwen3_5 hybrid-attention architecture
  # family (model_type "qwen3_5", alternating linear_attention/full_attention
  # layers) as the broken llama.cpp checkpoint -- deliberately chosen this
  # way: gx-fast already proves vLLM's kernel implementation of this exact
  # architecture family is correct on this GB10/sm_121 hardware, so this
  # reuses a confirmed-good engine/architecture pairing rather than
  # introducing an unverified one. It is DENSE (not MoE, unlike gx-fast's
  # A3B), so its ~27B active params/token is a real, meaningful reasoning/
  # coding capability step up from gx-fast's ~3B active params/token, while
  # being small enough (~22 GiB of safetensors) to load via vLLM without
  # tripping B-009's ~55 GiB vLLM checkpoint ceiling on this unified-memory
  # node. Apache-2.0, ungated, ~22 GiB total (verified via HF API file sizes
  # before download, not guessed) -- see coordination/DECISIONS.md for the
  # full record of this decision.
  #
  # LIVE-VERIFIED 2026-09-16 (B-011 closed). Deployed to node 2, cold-started
  # and exercised end to end:
  #   * the exact B-011 repro prompt ("The capital of France is", temperature 0,
  #     /v1/completions) now returns " Paris." -- previously "////////////////"
  #     byte-for-byte on the llama.cpp CUDA path;
  #   * a multi-step reasoning question through the real LiteLLM gateway is
  #     answered correctly, with <think> content separated into
  #     reasoning_content by --reasoning-parser qwen3;
  #   * vLLM resolves --quantization modelopt to `modelopt_mixed` and selects
  #     the GDN linear-attention kernels (Triton/FLA prefill, CUDA decode) --
  #     i.e. it drives the SAME hybrid-attention code path llama.cpp got wrong,
  #     and gets it right.
  # See TEST_RESULTS.md for the full numbers.
  gx_reason_model_dir: "/models/vllm/Qwen3.6-27B-NVFP4"
  gx_reason_host_dir: "Qwen3.6-27B-NVFP4"

  # 20.42 GiB of weights (measured on disk) + KV cache for a 65536-token
  # context comfortably fits a conservative pool; 0.35 x ~121 GiB ~= 42 GiB,
  # leaving the rest of the heavy-tier budget below untouched for ComfyUI's
  # reservation. MEASURED 2026-09-16: loading gx-reason moves node 2 from
  # ~114 GiB to ~70 GiB MemAvailable, i.e. a real ~44 GiB node-level
  # footprint -- within a GiB of this pool figure, so 0.35 behaves as
  # intended. THIS fraction, not the cgroup cap below, is what actually
  # bounds the footprint (see the cap's own note).
  gx_reason_gpu_fraction: "0.35"

  # ----------------------------------------------------------------------------
  # HOST-RESILIENCE HARDENING (added 2026-09-14, after the gx10-02 mmap-thrash
  # incident - see coordination/BLOCKERS.md B-012 and node01.yaml's matching
  # block for the full rationale: --memory is an enforced backstop for the
  # SAME ceiling the "heavy" group above already assumes structurally, and
  # --oom-score-adj biases the kernel to kill this container, not sshd/
  # tailscaled/systemd/NetworkManager, in a genuine system-wide OOM.
  #
  # Lowered 78g -> 45g on 2026-09-15 along with the B-011 engine/model
  # replacement above. Re-measured live 2026-09-16 and CONFIRMED as the right
  # order of magnitude: the loaded model's real node-level footprint is
  # ~44 GiB (MemAvailable 114 -> 70 GiB).
  #
  # IMPORTANT, MEASURED 2026-09-16 -- this cgroup cap does NOT bound that
  # 44 GiB (coordination/BLOCKERS.md B-021). With the model fully loaded the
  # container's own `memory.current` was only 10.92 GiB while the node lost
  # 44 GiB: on this unified-memory platform the CUDA/GPU pool is not charged
  # to the container's memory cgroup. So `--memory 45g` constrains the
  # HOST-side allocations only; the thing that actually bounds the total
  # footprint is --gpu-memory-utilization above. Keep the cap (it is still a
  # real backstop against a host-side leak, and it is what OOM-killed the
  # orphaned gx-max-rank1 in B-020) but do not size the node budget as if it
  # were enforcing the whole figure.
  gx_reason_mem_limit: "45g"
  gx_reason_oom_score_adj: "900"

models:

  # ============================================================================
  # gx-reason — heavy tier
  # ============================================================================
  # nvidia/Qwen3.6-27B-NVFP4 on vLLM. Replaces the confirmed-broken
  # Qwen3.5-122B-A10B GGUF/llama.cpp combination -- see B-011 (root-caused to
  # a llama.cpp CUDA/GDN kernel bug for this hybrid architecture, not the
  # checkpoint) and the macro block above for the full replacement rationale.
  #
  # Same vllm_image as node1's gx-fast (jstarkg/vllm-gb10-flashnext:0.28-sm121-r6)
  # -- a proven-good engine/driver combination on this exact hardware for the
  # same qwen3_5 hybrid-attention architecture family, deliberately reused
  # rather than introducing an unverified engine.
  #
  # --quantization modelopt: required per the checkpoint's own model card for
  # this NVIDIA ModelOpt NVFP4 quantization.
  # --max-model-len 65536: same conservative figure gx-fast uses; this
  # checkpoint supports up to 262144 but KV at long context is the real
  # memory risk (D-009), so raise it only with a measured KV figure.
  # --tool-call-parser qwen3_xml, --reasoning-parser qwen3: same family as
  # gx-fast for tool calls; qwen3 reasoning parser extracts <think> content
  # into reasoning_content instead of burning the output budget on it.
  #
  # --speculative-config mtp x2 (D-039): the checkpoint ships one MTP layer
  # (mtp_num_hidden_layers 1). Measured 2026-09-17: decode 12.2 -> 25-28
  # tok/s, mean acceptance ~2.8, same answers on the code/reasoning checks.
  # A dense 27B is memory-bandwidth bound on GB10, so this is the main lever.
  # --safetensors-load-strategy prefetch was TRIED and reverted (2026-09-17):
  # the files reached the page cache in 4-10 s but the load still took 152 s
  # (lazy mmap: 115-136 s). The limit is the 45 GiB container cgroup holding
  # page cache plus weights, not the NVMe; prefetch only adds cache pressure.
  #
  # ttl: 1200 -> 20 min idle then unload (D-039). A cold start costs ~6 min
  # and a reasoning answer several more, so 15 min made follow-up questions
  # pay the load again. The TTL stays well inside the media router's 30-min
  # resource wait (GX_MEDIA_RESOURCE_WAIT): a queued image/video job waits at
  # most ~21 min for gx-reason to unload and never times out on it.
  gx-reason:
    name: "gx-reason"
    description: >
      nvidia/Qwen3.6-27B-NVFP4 on vLLM. Dense 27B, hybrid attention, hard
      reasoning and coding tier. Frees ComfyUI's idle models before it
      starts; do not co-schedule with a running media job. Replaces the broken Qwen3.5-122B-A10B
      GGUF/llama.cpp tier (B-011).
    proxy: "http://127.0.0.1:25800"
    checkEndpoint: /health
    ttl: 1200
    unloadTimeout: 180
    # The first line refuses a start while gx10-02 is in Maintenance mode
    # (D-037: the Control Center's hold file, mounted read-only at /srv/guard).
    # The second hands node 2 over from ComfyUI (frees its models unless a
    # generation is running; gx-media-router refuses then). Without it a cold
    # start in the 10 minutes after a media job failed vLLM's free-memory
    # check (2026-09-17, TEST_RESULTS §19.7).
    cmd: >
      sh -c 'if [ -e /srv/guard/node2.maintenance-hold ]; then echo "gx-reason refused: gx10-02 is in Maintenance mode" >&2; exit 1; fi;
      docker exec gx-media-router python -m gx_media_router.free_node >/dev/null 2>&1;
      docker rm -f gx-reason >/dev/null 2>&1;
      exec docker run --rm --name gx-reason
      --network ${swap_netns}
      --device nvidia.com/gpu=all
      --ipc host --shm-size 16g
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      -e NVIDIA_DISABLE_FORWARD_COMPATIBILITY=1
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      -e VLLM_USE_DEEP_GEMM=0
      -v ${models_root}/vllm:/models/vllm:ro
      -v ${vllm_cache_root}/gx-reason:/root/.cache
      --memory ${gx_reason_mem_limit}
      --memory-swap ${gx_reason_mem_limit}
      --oom-score-adj ${gx_reason_oom_score_adj}
      ${vllm_image}
      ${gx_reason_model_dir}
      --served-model-name gx-reason
      --host ${host} --port 25800
      --gpu-memory-utilization ${gx_reason_gpu_fraction}
      --quantization modelopt
      --max-model-len 65536
      --max-num-seqs 8
      --max-num-batched-tokens 16384
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":2}"
      --trust-remote-code'
    cmdStop: "docker stop -t 150 gx-reason"
