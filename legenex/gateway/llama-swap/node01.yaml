# ==============================================================================
# llama-swap — NODE 1 (gx10-01, control node)
# ==============================================================================
# Role: MODEL PROCESS LIFECYCLE ONLY.
#   - starts a model container on the first request that needs it
#   - health-checks it, proxies to it, unloads it when idle (ttl)
#   - enforces which models may be resident at the same time (routing.groups)
#
# NOT its job:
#   - user-facing routing / aliasing      -> LiteLLM (legenex/gateway/litellm/config.yaml)
#   - tier selection for gx-auto          -> lead's orchestrator on :18900
#   - gx-max (SGLang TP=2 across nodes)   -> lead's orchestrator, NEVER this file
#
# Managed here: gx-mini (resident tier), gx-fast (heavy tier).
#
# ------------------------------------------------------------------------------
# MEMORY BUDGET — NODE 1 (hard rule)
# ------------------------------------------------------------------------------
# The node has 128 GB (~121 GiB) of UNIFIED memory shared by CPU and GPU.
# Budget, never to be exceeded:
#
#   resident tier (group "resident")   <= 14 GB   (gx-mini only)
#   heavy tier    (group "heavy")      <= 86 GB   (exactly ONE member at a time)
#   ------------------------------------------------
#   ceiling                            ~100 GB     -> >= 28 GB headroom
#
# Structural enforcement:
#   * "heavy"   has swap: true  -> at most one heavy model is ever loaded.
#   * "resident" has swap: false but is capped by design to gx-mini only.
#   * gx-fast pins --gpu-memory-utilization (see ${gx_fast_gpu_fraction});
#     it is NOT adaptive, so its footprint cannot drift upward under load.
#
# RULE FOR FUTURE MODELS ON NODE 1:
#   Every new model MUST be added to exactly one of these two groups.
#   - resident: only if its full footprint fits inside the remaining part of 14 GB
#   - heavy:    anything larger; the group's swap:true keeps it exclusive
#   A model left out of both groups lands in llama-swap's implicit default group
#   and may then coexist with the heavy tier -> budget blown. Do not do that.
#
# ------------------------------------------------------------------------------
# GPU ACCESS ON THIS NODE
# ------------------------------------------------------------------------------
# gx10-01 has NO `nvidia` docker runtime. `docker info` lists only runc.
# GPUs are exposed through CDI (spec: /var/run/cdi/nvidia.yaml), exactly as the
# live gx-max-rank0 container does it. Therefore every spawned container below
# uses:   --device nvidia.com/gpu=all
# Do NOT change these to `--runtime nvidia --gpus all` — that fails on this node.
#
# ------------------------------------------------------------------------------
# NETWORKING
# ------------------------------------------------------------------------------
# Spawned model containers join the llama-swap container's network namespace
# (--network container:gx-llama-swap-node01), so inside llama-swap every model
# is reachable on 127.0.0.1:<port>. Ports that must be visible on the host
# (gx-mini on 19001) are published by the llama-swap service in
# docker-compose.gateway.yml, because they share the same namespace.
#
# Model traffic never leaves this node except over the ConnectX/RoCE fabric.
# Tailscale is management/SSH only.
#
# ------------------------------------------------------------------------------
# SCHEMA NOTE (read before editing)
# ------------------------------------------------------------------------------
# This file targets the CURRENT llama-swap schema, where group routing lives under
# `routing.router.settings.groups`. Older releases used a TOP-LEVEL `groups:` key.
# If the deployed binary rejects the `routing:` block, the safe fallback is to
# DELETE the whole `routing:` section: llama-swap then falls back to its default
# of one model at a time, which is strictly more conservative than this budget
# (gx-mini simply stops being resident while gx-fast runs). Never "fix" it by
# loosening the groups.
# Validate without starting anything:  llama-swap -config node01.yaml -dry-run
# ==============================================================================

# Seconds to wait for a freshly started model to answer its checkEndpoint.
# vLLM cold start on unified memory (weight load + CUDA graph capture) is slow.
healthCheckTimeout: 1800

logLevel: debug
logTimeFormat: rfc3339
logToStdout: proxy
metricsMaxInMemory: 1000
captureBuffer: 0            # do not buffer request/response bodies (privacy)

# ${PORT} allocation base. Kept clear of: 4000 (LiteLLM), 18900 (orchestrator),
# 19001 (gx-mini, pinned), 28080 (this service), 30000 (SGLang / gx-max).
startPort: 15800

# Never auto-unload unless a model sets its own ttl.
globalTTL: 0

# `docker stop` on a large vLLM process is not instant. Give it room to drain
# in-flight requests before llama-swap force-kills it.
unloadTimeout: 180

# Cluster-wide back-pressure: reject rather than queue unbounded work.
globalConcurrencyLimit: 16

sendLoadingState: false
includeAliasesInList: false

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------
# Inference endpoints require a bearer token. The value comes from the
# environment ONLY (${env.*}); nothing secret is ever written into this file.
# If GX_SWAP_API_KEY is unset, llama-swap REFUSES to start — fail closed, by design.
# NOTE: this protects the inference API. The admin UI / /api surface is protected
# by binding the published port to 127.0.0.1 (see docker-compose.gateway.yml).
apiKeys:
  - "${env.GX_SWAP_API_KEY}"

# ------------------------------------------------------------------------------
# MACROS
# ------------------------------------------------------------------------------
macros:
  host: "0.0.0.0"

  # Host-side model root. Mounted read-only into every spawned container.
  models_root: "/srv/models"
  # D-039: persistent torch.compile / Triton / FlashInfer JIT caches, one
  # directory per model. The model containers run with --rm, so without this
  # every cold start recompiled (gx-reason: ~32 s compile + ~53 s warmup).
  # vLLM keys its caches by config and code hash, so a new image or flag set
  # never reuses a stale entry. Files are written by the container (root);
  # clear them with `docker run --rm -v <dir>:/c alpine sh -c 'rm -rf /c/*'`.
  vllm_cache_root: "/srv/projects/gx-cluster/runtime/vllm-cache"

  # Network namespace shared by all spawned model containers. MUST match
  # container_name of the llama-swap service in docker-compose.gateway.yml.
  swap_netns: "container:gx-llama-swap-node01"

  # llama.cpp image — already present locally on gx10-01 (verified: docker images).
  llamacpp_image: "legenex/llama-cpp-spark:latest"

  # ---- gx-fast (D-030, 2026-09-17) --------------------------------------------
  # kyaky/Qwen3.6-35B-A3B-Uncensored-NVFP4 @ 33d5cf837389 (verified manifest in
  # the model directory). compressed-tensors: NVFP4 W4A16 routed experts, FP8
  # block attention/shared experts, BF16 vision tower. Rollback checkpoint:
  # /models/vllm/Qwen3.6-35B-A3B-NVFP4 (nvidia, kept until acceptance).
  vllm_image: "jstarkg/vllm-gb10-flashnext:0.28-sm121-r6"
  gx_fast_model_dir: "/models/vllm/Qwen3.6-35B-A3B-Uncensored-NVFP4"

  # Fraction of the node's 121.6 GiB unified memory vLLM may claim (weights
  # 21 GiB + KV + activations + CUDA graphs). 0.34 ~= 41 GiB (0.40 measured a
  # 22 GiB KV pool = 2.1M tokens, far more than 8 sequences need). Sized so that
  # gx-mini (~10 GiB) + gx-fast + the control plane leave >= 30 GiB
  # MemAvailable: both stay resident (measured, TEST_RESULTS.md §18).
  gx_fast_gpu_fraction: "0.34"

  # ----------------------------------------------------------------------------
  # HOST-RESILIENCE HARDENING (added 2026-09-14, after the gx10-02 mmap-thrash
  # incident that took SSH down on that node - see coordination/BLOCKERS.md
  # B-012). These are DOCKER-level cgroup backstops, not a change to the budget
  # numbers above - they encode the SAME ceilings the group-exclusivity routing
  # already assumes, as an enforced `--memory` cap rather than a purely
  # structural one, plus `--oom-score-adj` so the kernel prefers to kill a
  # runaway model container over sshd/tailscaled/systemd/NetworkManager (which
  # run outside Docker, at the host's default oom_score_adj=0, and cannot be
  # given cgroup memory.min/priority without root - see the host-resilience
  # writeup for the full root-vs-no-root evidence).
  #
  # This does NOT replace the admission-control work in legenex/orchestrator
  # (the pre-launch "is there enough free memory" check) - it is the layer
  # that still protects the host if that check is ever bypassed, wrong, or a
  # container is started outside the normal path (exactly how B-012 happened:
  # a second model container was started by hand, outside llama-swap's group
  # routing entirely).
  #
  # oom-score-adj scale used across this stack (-1000..1000, higher = killed
  # first): 700 for the small resident tier, 900 for the heavy/one-at-a-time
  # tier, 950 for gx-max (see legenex/lifecycle/gx-max.conf). Gateway/control
  # containers use 100 (see docker-compose.gateway.yml). Everything we run is
  # positive, i.e. preferred for OOM-kill ahead of any unmodified host daemon.
  # gx-mini checkpoint (verified: /srv/models/gguf/<dir>/.gx-manifest.json)
  gx_mini_model: "/models/gguf/Ornith-1.5-9B-uncensored-Q8_0/Ornith-1.5-9B-uncensored-Q8_0.gguf"
  gx_mini_mmproj: "/models/gguf/Ornith-1.5-9B-uncensored-Q8_0/mmproj-Ornith-1.5-9B-uncensored-f16.gguf"
  gx_code_model: "/models/gguf/Ornith-1.5-35B-A3B-Uncensored/Ornith-1.5-35B-Uncensored-Q5_K_M.gguf"
  gx_code_mmproj: "/models/gguf/Ornith-1.5-35B-A3B-Uncensored/mmproj-Ornith-1.5-35B-Uncensored-BF16.gguf"

  gx_mini_mem_limit: "14g"
  gx_mini_oom_score_adj: "700"
  gx_fast_mem_limit: "60g"
  gx_fast_oom_score_adj: "900"

models:

  # ============================================================================
  # gx-mini — resident tier (D-030, 2026-09-17)
  # ============================================================================
  # HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive @ c09cdbcdb1fe
  #   Q4_K_M GGUF (2.71 GB) + BF16 mmproj (0.68 GB, vision).
  # Uncensored ("aggressive" refusal removal), multimodal, tool calling via
  # the model's own Jinja template (--jinja).
  #
  # Context: --ctx-size 131072 split over --parallel 2 -> 65536 tokens per
  # request slot. Hybrid Gated-DeltaNet/attention (3:1), so the KV cache for
  # the full 131072 is ~4 GB f16. Footprint ~10 GB: inside the 14 GB budget.
  #
  # ttl 0 + startup preload (hooks below) -> resident. Port 19001 is pinned
  # (published by the llama-swap service in docker-compose.gateway.yml).
  gx-mini:
    name: "gx-mini"
    description: "Ornith-1.5-9B uncensored Q8_0 (llama.cpp, vision, tools). Node 1, resident."
    proxy: "http://127.0.0.1:19001"
    checkEndpoint: "/health"
    ttl: 0
    unloadTimeout: 30
    cmd: >
      sh -c 'docker rm -f gx-mini >/dev/null 2>&1;
      exec docker run --rm --name gx-mini
      --network ${swap_netns}
      --device nvidia.com/gpu=all
      --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      --env-file /app/env/gx-mini.env
      -v ${models_root}/gguf:/models/gguf:ro
      --memory ${gx_mini_mem_limit}
      --memory-swap ${gx_mini_mem_limit}
      --oom-score-adj ${gx_mini_oom_score_adj}
      ${llamacpp_image}
      -m ${gx_mini_model}
      --mmproj ${gx_mini_mmproj}
      --alias gx-mini
      --host ${host} --port 19001
      --ctx-size 131072
      --n-gpu-layers 99
      --parallel 2
      --flash-attn on
      --load-mode mlock
      --jinja
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0
      --timeout 600'
    cmdStop: "docker stop -t 25 ${MODEL_ID}"

  # ============================================================================
  # gx-fast — primary coding / tools / agent tier (resident, D-030)
  # ============================================================================
  # Kilo Code's workhorse. Thinking is off by default at the gateway
  # (LiteLLM extra_body) so interactive turns answer immediately; a client may
  # turn it on per request. Tool calls use Qwen3's XML format.
  #
  # ttl 0 + startup preload -> resident, so a normal Kilo prompt never waits
  # for a multi-minute cold start. gx-max's drain still stops it (it stops the
  # whole llama-swap-node01 container) and restore-normal.sh brings it back.
  gx-fast:
    name: "gx-fast"
    description: "kyaky Qwen3.6-35B-A3B Uncensored NVFP4 on vLLM. Coding, tools, vision. Node 1, resident."
    checkEndpoint: "/health"
    ttl: 0
    unloadTimeout: 180
    cmd: >
      sh -c 'docker rm -f gx-fast >/dev/null 2>&1;
      exec docker run --rm --name gx-fast
      --network ${swap_netns}
      --device nvidia.com/gpu=all
      --ipc host --shm-size 16g
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      -e NVIDIA_DISABLE_FORWARD_COMPATIBILITY=1
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      -e VLLM_USE_DEEP_GEMM=0
      -e HF_HUB_OFFLINE=1
      -v ${models_root}/vllm:/models/vllm:ro
      -v ${vllm_cache_root}/gx-fast:/root/.cache
      --memory ${gx_fast_mem_limit}
      --memory-swap ${gx_fast_mem_limit}
      --oom-score-adj ${gx_fast_oom_score_adj}
      ${vllm_image}
      ${gx_fast_model_dir}
      --served-model-name gx-fast
      --host ${host} --port ${PORT}
      --gpu-memory-utilization ${gx_fast_gpu_fraction}
      --max-model-len 131072
      --max-num-seqs 8
      --max-num-batched-tokens 16384
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --limit-mm-per-prompt.image 4
      --limit-mm-per-prompt.video 0
      --trust-remote-code'
    cmdStop: "docker stop -t 150 ${MODEL_ID}"

  gx-code:
    name: "gx-code"
    description: "Ornith-1.5-35B-A3B Uncensored Q5_K_M llama.cpp. Independent coding worker, node 1."
    proxy: "http://127.0.0.1:19011"
    checkEndpoint: "/health"
    ttl: 0
    unloadTimeout: 60
    cmd: >
      sh -c 'docker rm -f gx-code >/dev/null 2>&1;
      exec docker run --rm --name gx-code
      --network ${swap_netns}
      --device nvidia.com/gpu=all
      --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      -e GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
      -v ${models_root}/gguf:/models/gguf:ro
      --memory 48g
      --memory-swap 48g
      --oom-score-adj 900
      ${llamacpp_image}
      -m ${gx_code_model}
      --mmproj ${gx_code_mmproj}
      --alias gx-code
      --host ${host} --port 19011
      --ctx-size 65536
      --n-gpu-layers 99
      --parallel 1
      --flash-attn on
      --jinja
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0
      --timeout 600'
    cmdStop: "docker stop -t 40 gx-code"

# ==============================================================================
# ROUTING / CONCURRENCY CONTROL
# ==============================================================================
# This is what makes the 100 GB ceiling structural rather than aspirational.
#
#   resident : swap false      -> members coexist
#              exclusive false -> loading one does not evict other groups
#              persistent true -> NO other group can ever evict gx-mini
#   heavy    : swap true       -> only ONE member loaded at a time
#              exclusive false -> loading it leaves gx-mini alone
#
# Worst case simultaneously loaded = gx-mini (<=14 GB) + one heavy (<=86 GB).
routing:
  router:
    use: group
    settings:
      groups:
        resident:
          persistent: true
          swap: false
          exclusive: false
          members:
            - gx-mini
        heavy:
          persistent: false
          swap: true
          exclusive: false
          members:
            - gx-fast
            - gx-code

# ==============================================================================
# STARTUP PRELOAD (D-030, 2026-09-17)
# ==============================================================================
# The resident tiers are loaded when llama-swap starts, so the first Kilo
# prompt after a boot or a gx-max release does not wait for a cold start.
# Safe because llama-swap-node01 is itself stopped by gx-max-start.sh's drain
# and only restarted by restore-normal.sh after gx-max has released node 1,
# and gx-max is never started at boot.
hooks:
  on_startup:
    preload:
      - gx-mini
      - gx-fast
