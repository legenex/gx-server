# ==============================================================================
# LiteLLM — the single OpenAI-compatible gateway for the gx cluster (V4.1)
# ==============================================================================
# Runs on NODE 1 (gx10-01), container port 4000. Public aliases, the ONLY two:
#
#   gx-max    gx-auto
#
# Both resolve to the lead's orchestrator on :18900, which owns the request
# queue, profile/reasoning selection and the DeepSeek V4.1 Flash EXL3 runtime
# (Mia kit, served model id DeepSeek-v4.1-Flash-EXL3, OpenAI loopback :8888).
# The retired L-6/L-10 alias set (gx-mini, gx-code, gx-fast, gx-reason and the
# media aliases) is deleted; its history lives under git tag
# pre-deepseek-v41-rebuild-20260927.
#
# ------------------------------------------------------------------------------
# SECRETS
# ------------------------------------------------------------------------------
# Every credential is read from the environment via LiteLLM's `os.environ/` form.
# NO secret, and no credential-bearing URL, may ever appear in this file.
# See legenex/gateway/.env.sample for the variables and how to generate them.
#
# Virtual keys (rpms / parallel-request caps / model budgets per consumer, e.g.
# hermes, open-webui, gx-computer) are managed in the LiteLLM DATABASE via the
# admin UI, deliberately NOT in this file. Trim each key's model list to
# {gx-max, gx-auto} when this file is first deployed.
#
# ------------------------------------------------------------------------------
# WHERE EACH ALIAS ACTUALLY GOES
# ------------------------------------------------------------------------------
#   gx-max  -> orchestrator http://host.docker.internal:18900/v1  (mode direct)
#   gx-auto -> orchestrator http://host.docker.internal:18900/v1  (mode auto)
#
# The orchestrator accepts BOTH alias names as the model id and maps them to
# the served model id DeepSeek-v4.1-Flash-EXL3 (registry
# legenex/models/registry.json, schema 2). host.docker.internal resolves to
# the host gateway (docker-compose.gateway.yml sets extra_hosts: host-gateway).
#
# ------------------------------------------------------------------------------
# NO SILENT FALLBACK — READ THIS
# ------------------------------------------------------------------------------
# There is exactly ONE model family. If the cluster cannot serve a request, it
# must FAIL with an error — silently answering from a different model would be
# worse than an error, and gx-max must never fall back to the stock pack.
# Enforced globally below: num_retries 0, fallbacks [], context_window_fallbacks
# [], content_policy_fallbacks []. Do not add entries to any of these lists.
# ==============================================================================

general_settings:
  # --- authentication -------------------------------------------------------
  # Required. Every API call needs Authorization: Bearer <this key> (or a
  # virtual key minted from it). Sourced from the environment only.
  master_key: os.environ/LITELLM_MASTER_KEY

  # LiteLLM proxy database (keys, budgets, usage, admin UI sessions). Assembled
  # from POSTGRES_* by docker-compose.gateway.yml; prompt/completion bodies are
  # never stored (turn_off_message_logging below).
  database_url: os.environ/DATABASE_URL

  # Admin UI credentials are supplied to the container as UI_USERNAME /
  # UI_PASSWORD environment variables and are intentionally NOT referenced here,
  # so this file can never leak them.
  ui_access_mode: admin_only

  # Do not echo the master key back in API responses.
  disable_master_key_return: true

  # --- least privilege ------------------------------------------------------
  # No runtime model creation: the alias set is fixed by this file and reviewed
  # in git. Anything else would let a UI session add an unaudited upstream.
  allow_model_creation: false
  store_model_in_db: false

  # --- health ---------------------------------------------------------------
  # Background health checks are OFF. LiteLLM probing the orchestrator would
  # add queue noise and can wake the two-node runtime for no user request.
  # /health/liveliness and /health/readiness still work (they do not touch
  # upstreams); /health is authenticated.
  background_health_checks: false
  health_check_interval: 0
  health_check_details: false

model_list:

  # ===========================================================================
  # gx-max — explicit DeepSeek V4.1 Flash (uncensored), mode "direct".
  # ===========================================================================
  # Plain pass-through to the orchestrator: no routing logic lives here, the
  # orchestrator enqueues the request with the caller's (or default) profile
  # and reasoning. NO FALLBACKS — a failed gx-max request returns an error.
  - model_name: gx-max
    litellm_params:
      model: openai/gx-max
      api_base: "http://host.docker.internal:18900/v1"
      api_key: os.environ/GX_ORCHESTRATOR_API_KEY
      drop_params: true
      include_reasoning: true
      supports_reasoning: true
      merge_reasoning_content_in_choices: true
      # Queued + served end to end: a long architecture-grade generation can
      # legitimately take tens of minutes behind the scheduler.
      timeout: 3600
      num_retries: 0
    model_info:
      # Registry model dsv41-flash-exl3-uncensored, max_context 262144.
      # The orchestrator applies the final context budget, so this is the
      # advertised window minus a sane output allowance.
      max_input_tokens: 245760
      max_output_tokens: 16384
      mode: direct
      uncensored: true
      supports_vision: true
      supports_function_calling: true
      supports_reasoning: true
      description: Explicit DeepSeek V4.1 Flash (uncensored)

  # ===========================================================================
  # gx-auto — profile/reasoning auto-selection, mode "auto".
  # ===========================================================================
  # Same single upstream; the orchestrator's autoroute maps intent headers
  # (X-GX-Intent, forwarded by the gx_budget_hook) to (profile, reasoning).
  # This gateway deliberately implements none of that logic — there is
  # exactly one place where selection happens.
  - model_name: gx-auto
    litellm_params:
      model: openai/gx-auto
      api_base: "http://host.docker.internal:18900/v1"
      api_key: os.environ/GX_ORCHESTRATOR_API_KEY
      drop_params: true
      include_reasoning: true
      supports_reasoning: true
      merge_reasoning_content_in_choices: true
      timeout: 3600
      num_retries: 0
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384
      mode: auto
      uncensored: true
      supports_vision: true
      supports_function_calling: true
      supports_reasoning: true
      description: Profile/reasoning auto-selection

litellm_settings:
  drop_params: true
  set_verbose: false

  # --- attribution + context guard + text latency metrics -------------------
  # gx_hooks.gx_budget_hook: forwards X-GX-* attribution headers to the
  # orchestrator, applies a context-budget guard for the two aliases using the
  # orchestrator's budget module (mounted read-only at /app/gx_lib), and
  # appends one privacy-safe timing line per request (never prompt text).
  callbacks: ["gx_hooks.gx_budget_hook.proxy_handler_instance"]

  # Long enough for a queued + served request; the per-deployment `timeout`
  # above is the one that matters per alias.
  request_timeout: 1800

  # --- NEVER silently substitute a model ------------------------------------
  # Applied to every alias: a failure surfaces as an error to the caller
  # instead of being retried into the same (or, worse, a different) upstream.
  # Do not add entries to any of these lists. See NO SILENT FALLBACK above.
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []

  merge_reasoning_content_in_choices: true

  # --- privacy-safe logging -------------------------------------------------
  # Prompts and completions are never written to logs or the spend database.
  # Only metadata (model, token counts, latency, status, attribution) is kept.
  turn_off_message_logging: true
  redact_user_api_key_info: true

  # --- concurrency ----------------------------------------------------------
  # Requests QUEUE in the orchestrator's scheduler now (per-profile
  # max_num_seqs, strict priority, round-robin across projects), so the
  # gateway may hold more in-flight requests and let the scheduler enforce
  # admission. 16 (raised from the old 8): still bounded so the gateway
  # itself never becomes a second, dumber queue in front of the real one —
  # the orchestrator is the single admission authority.
  global_max_parallel_requests: 16
  max_request_size_mb: 160
  max_response_size_mb: 160

router_settings:
  routing_strategy: simple-shuffle
  # Reinforces the no-silent-substitution rule at the router layer.
  num_retries: 0
  # Do not park a deployment in cooldown after a failure — each alias is a
  # single distinct upstream, so a cooldown only turns one failure into a
  # burst of 429 "No deployments available" (seen 2026-09-17; D-039).
  disable_cooldowns: true
  allowed_fails: 1000
  cooldown_time: 0
