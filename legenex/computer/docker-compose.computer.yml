# ==============================================================================
# gx cluster — OPEN WEBUI COMPUTER (NODE 1 / gx10-01 only)
# ==============================================================================
# Official Open WebUI Computer, pinned to a stable release tag.
# Workspaces are the real host tree:
#   /home/legenex/Documents/Projects/Server  ->  /projects
# so gx-cluster is /projects/gx-cluster.
#
# Networking:
#   * Joins the existing gx_gateway bridge so Computer can reach gx-litellm
#     at http://gx-litellm:4000/v1. LiteLLM stays loopback-published on the host.
#   * Web UI is bound to Tailscale (management) and loopback only.
#   * Not published on 0.0.0.0, not on ConnectX, no Docker socket, not privileged.
#
# First start prints a one-time setup URL with a token in `docker logs gx-computer`.
# ==============================================================================

name: gx-computer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  computer:
    image: ${GX_COMPUTER_IMAGE:-ghcr.io/open-webui/computer:0.9.21}
    container_name: gx-computer
    restart: unless-stopped
    ports:
      - "${GX_COMPUTER_TS_BIND:-100.105.214.61}:${GX_COMPUTER_PORT:-8000}:8000"
      - "127.0.0.1:${GX_COMPUTER_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CPTR_DATA_DIR: /data
      CPTR_LOG_LEVEL: ${GX_COMPUTER_LOG_LEVEL:-INFO}
      # The repo .gitignore already ignores **/.cptr/* (except system.md and
      # model). Stop Computer appending its own `.cptr` line to .gitignore.
      CPTR_AUTO_GITIGNORE_DOT_CPTR: "false"
      # Default is "*" with credentials, which lets any same-host origin
      # (other apps on 100.105.214.61) drive this API. Pin it to Computer's
      # own origins. Socket.IO (chat streaming) uses the same list, so every
      # hostname used to open Computer must be here; add the MagicDNS FQDN via
      # GX_COMPUTER_CORS_ORIGINS in .env.
      CPTR_CORS_ALLOWED_ORIGINS: ${GX_COMPUTER_CORS_ORIGINS:-http://100.105.214.61:8000,http://127.0.0.1:8000,http://localhost:8000,http://gx10-01:8000}
    volumes:
      - gx_computer_data:/data
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}:/projects
      # SECRETS: the real gateway .env lives in /srv/projects/gx-cluster/secrets/
      # (not mounted); legenex/gateway/.env is a symlink that dangles in here.
      # Never hide a secret with a single-file overlay: replacing the host file
      # (atomic write, git checkout) silently detaches such a mount.
      #
      # READ-ONLY directory overlays: everything the host executes without a
      # human deciding to restart something, or that controls what gets
      # committed and published. Directory mounts survive host file rewrites.
      #   .git              config (fsmonitor/hooksPath/filters), hooks, refs,
      #                     index, worktrees: no planted hooks, no forged
      #                     commits. gx10-01 autosync commits Computer's edits.
      #   .githooks, ops/git-sync   the publishing pipeline
      #   .kilo             Kilo's linked worktree (own relative hooksPath)
      #   legenex/host      gx-hostwatch.sh, run every 60 s on BOTH nodes
      #   legenex/gateway   LiteLLM config + hooks (hold the master key), llama-swap yaml
      #   legenex/lifecycle run by the orchestrator on gx-max acquire/release
      #   legenex/scripts, legenex/media   run by Control Center actions
      #   legenex/computer  this compose file, .env and the host-run tools
      #   legenex/orchestrator, legenex/common   imported by the lifecycle scripts
      #                     (gx-max acquire) and the Control Center at runtime
      # create_host_path: false — a missing source fails the start instead of
      # Docker creating a root-owned path in the tree (no sudo on this node).
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.git
        target: /projects/gx-cluster/.git
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.githooks
        target: /projects/gx-cluster/.githooks
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/ops/git-sync
        target: /projects/gx-cluster/ops/git-sync
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.kilo
        target: /projects/gx-cluster/.kilo
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/host
        target: /projects/gx-cluster/legenex/host
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/gateway
        target: /projects/gx-cluster/legenex/gateway
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/lifecycle
        target: /projects/gx-cluster/legenex/lifecycle
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/scripts
        target: /projects/gx-cluster/legenex/scripts
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/media
        target: /projects/gx-cluster/legenex/media
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/computer
        target: /projects/gx-cluster/legenex/computer
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/orchestrator
        target: /projects/gx-cluster/legenex/orchestrator
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/common
        target: /projects/gx-cluster/legenex/common
        read_only: true
        bind: {create_host_path: false}
      # Single file (no directory to hang it on): the ignore rules that keep
      # .cptr transcripts out of the public repo. A host rewrite of .gitignore
      # detaches it; the autosync forbidden-path guard for .cptr/** is the
      # backstop and tools/verify.py checks the mount is present.
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.gitignore
        target: /projects/gx-cluster/.gitignore
        read_only: true
        bind: {create_host_path: false}
      # Agent instruction files (single-file, no secrets): an injected agent must
      # not plant persistent instructions for Computer or for Claude Code on the host.
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/CLAUDE.md
        target: /projects/gx-cluster/CLAUDE.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.cptr/system.md
        target: /projects/gx-cluster/.cptr/system.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.cptr/model
        target: /projects/gx-cluster/.cptr/model
        read_only: true
        bind: {create_host_path: false}
      # Host Grok Build CLI binary only (statically linked). Host auth is NOT
      # mounted. A `grok login` inside Computer is stored in /home/cptr/.grok
      # in the container layer (lost on recreate), not in the data volume.
      - ${GX_GROK_BIN:-/home/legenex/.local/bin/grok}:/usr/local/bin/grok:ro
    security_opt:
      - no-new-privileges:true
    # Runs as uid 1000 with no effective capabilities already; drop the
    # bounding set too and cap process count.
    cap_drop: [ALL]
    pids_limit: ${GX_COMPUTER_PIDS_LIMIT:-1024}
    mem_limit: ${GX_COMPUTER_MEM_LIMIT:-2g}
    oom_score_adj: ${GX_COMPUTER_OOM_SCORE_ADJ:-100}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks: [gx_gateway]

networks:
  gx_gateway:
    name: ${GX_NET_NAME:-gx_gateway}
    external: true

volumes:
  gx_computer_data:
    name: gx_computer_data
