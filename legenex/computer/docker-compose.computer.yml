# ==============================================================================
# gx cluster — OPEN WEBUI COMPUTER (NODE 1 / gx10-01 only)
# ==============================================================================
# Official Open WebUI Computer, pinned to a stable release tag.
# Workspaces are the real host tree:
#   /home/legenex/Documents/Projects/Server  ->  /projects
# so gx-cluster is /projects/gx-cluster.
#
# Networking:
#   * Joins the existing gx_gateway bridge so Computer can reach gx-litellm
#     at http://gx-litellm:4000/v1. LiteLLM stays loopback-published on the host.
#   * Web UI is bound to Tailscale (management) and loopback only.
#   * Not published on 0.0.0.0, not on ConnectX, no Docker socket, not privileged.
#
# First start prints a one-time setup URL with a token in `docker logs gx-computer`.
# ==============================================================================

name: gx-computer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  computer:
    image: ${GX_COMPUTER_IMAGE:-ghcr.io/open-webui/computer:0.9.21}
    container_name: gx-computer
    restart: unless-stopped
    ports:
      - "${GX_COMPUTER_TS_BIND:-100.105.214.61}:${GX_COMPUTER_PORT:-8000}:8000"
      - "127.0.0.1:${GX_COMPUTER_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CPTR_DATA_DIR: /data
      CPTR_LOG_LEVEL: ${GX_COMPUTER_LOG_LEVEL:-INFO}
      # The repo .gitignore already ignores **/.cptr/* (except system.md and
      # model). Stop Computer appending its own `.cptr` line to .gitignore.
      CPTR_AUTO_GITIGNORE_DOT_CPTR: "false"
      # Default is "*" with credentials, which lets any same-host origin
      # (other apps on 100.105.214.61) drive this API. Pin it to Computer's
      # own origins. Socket.IO (chat streaming) uses the same list, so every
      # hostname used to open Computer must be here; add the MagicDNS FQDN via
      # GX_COMPUTER_CORS_ORIGINS in .env.
      CPTR_CORS_ALLOWED_ORIGINS: ${GX_COMPUTER_CORS_ORIGINS:-http://100.105.214.61:8000,http://127.0.0.1:8000,http://localhost:8000,http://gx10-01:8000}
    volumes:
      - gx_computer_data:/data
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}:/projects
      # Hide the gateway .env so Computer can work on the real tree without
      # reading or rewriting production secrets.
      - ${GX_COMPUTER_HIDDEN_ENV:-./env.hidden}:/projects/gx-cluster/legenex/gateway/.env:ro
      # Read-only overlays: code Computer could plant here would run on the
      # host (git hooks, gx10-01 autosync). Normal git add/commit still works.
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.git/hooks:/projects/gx-cluster/.git/hooks:ro
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.githooks:/projects/gx-cluster/.githooks:ro
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/ops/git-sync:/projects/gx-cluster/ops/git-sync:ro
      # .git/config: a planted core.fsmonitor / core.hooksPath / filter driver
      # would run as the host user on the autosync watcher's next `git status`.
      # Commits do not write config; only `git config`/`push -u` fail here.
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.git/config:/projects/gx-cluster/.git/config:ro
      # Linked worktrees (Kilo's .kilo/worktrees/*) have their own relative
      # hooksPath and admin files that host-side git sessions trust.
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.git/worktrees:/projects/gx-cluster/.git/worktrees:ro
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.kilo:/projects/gx-cluster/.kilo:ro
      # gx-hostwatch.sh runs every 60 s on BOTH nodes (node 2 after autosync).
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/host:/projects/gx-cluster/legenex/host:ro
      # The ignore rules that keep .cptr transcripts out of the public repo.
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/.gitignore:/projects/gx-cluster/.gitignore:ro
      # Computer's own compose/.env (a socket mount would apply on the next
      # `up`) and the provisioning tools the host runs.
      - ${GX_COMPUTER_PROJECTS:-/home/legenex/Documents/Projects/Server}/gx-cluster/legenex/computer:/projects/gx-cluster/legenex/computer:ro
      # Single-file overlays pin the inode: after the host rewrites .gitignore
      # or .git/config (checkout, reset, `git config`), recreate this container.
      # tools/verify.py checks that the container view still matches the host.
      # Host Grok Build CLI binary only (statically linked). Host auth is NOT
      # mounted. A `grok login` inside Computer is stored in /home/cptr/.grok
      # in the container layer (lost on recreate), not in the data volume.
      - ${GX_GROK_BIN:-/home/legenex/.local/bin/grok}:/usr/local/bin/grok:ro
    security_opt:
      - no-new-privileges:true
    # Runs as uid 1000 with no effective capabilities already; drop the
    # bounding set too and cap process count.
    cap_drop: [ALL]
    pids_limit: ${GX_COMPUTER_PIDS_LIMIT:-1024}
    mem_limit: ${GX_COMPUTER_MEM_LIMIT:-2g}
    oom_score_adj: ${GX_COMPUTER_OOM_SCORE_ADJ:-100}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks: [gx_gateway]

networks:
  gx_gateway:
    name: ${GX_NET_NAME:-gx_gateway}
    external: true

volumes:
  gx_computer_data:
    name: gx_computer_data
