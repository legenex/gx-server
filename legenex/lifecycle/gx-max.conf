# ============================================================================
# gx-max — LOCKED CONFIGURATION
# ----------------------------------------------------------------------------
# These values were captured from the VERIFIED-WORKING run of 2026-09-14 that
# started cleanly on both nodes and served real inference (see TEST_RESULTS.md).
#
# DO NOT change the engine (SGLang), the model, --tp, --nnodes, or any of the
# SGLANG_*/B12X_* environment variables without an explicit human decision.
# See ARCHITECTURE.md -> "Locked decisions".
#
# Every value here is written as ${VAR:-default} so a caller can override it
# for a measurement or a dry run. That is NOT a licence to change the locked
# values in production: the defaults below ARE the locked configuration, and
# anything overriding GXMAX_IMAGE / GXMAX_MODEL_DIR / the topology is doing a
# test, not running gx-max. Found necessary 2026-09-16: an unconditional
# assignment here silently overrode the environment, so a synthetic
# unwind test that set GXMAX_IMAGE to a 150 MB placeholder launched the real
# 33 GB SGLang image and the real 163 GiB model on both nodes instead.
# ============================================================================

GXMAX_IMAGE="${GXMAX_IMAGE:-lmsysorg/sglang:dev-v4f-2dgx-v2}"

# Model path. Must exist at this SAME path on BOTH nodes.
GXMAX_MODEL_DIR="${GXMAX_MODEL_DIR:-/srv/models/deepseek/DeepSeek-V4-Flash-0731-NVFP4}"

# Distributed bootstrap. MUST be a ConnectX/RoCE address, never Tailscale.
GXMAX_DIST_ADDR="${GXMAX_DIST_ADDR:-192.168.100.10:5000}"

# Serving endpoint (node 1)
GXMAX_PORT="${GXMAX_PORT:-30000}"

# Management SSH target for node 2 (Tailscale = management plane only).
GXMAX_NODE2_SSH="${GXMAX_NODE2_SSH:-legenex-02@gx10-02}"

# Container names
GXMAX_RANK0_NAME="${GXMAX_RANK0_NAME:-gx-max-rank0}"
GXMAX_RANK1_NAME="${GXMAX_RANK1_NAME:-gx-max-rank1}"

# Host cache dir (bind-mounted to /root/.cache) — holds the FlashInfer autotune
# cache. Keeping it warm saves ~2 minutes of startup.
GXMAX_CACHE_DIR="${GXMAX_CACHE_DIR:-/var/tmp/sglang-cache}"

# Logs
GXMAX_LOG_DIR="${GXMAX_LOG_DIR:-/srv/logs}"

# Startup budget. A cold start measured 630s to "ready" (401s of that is weight
# loading). 1800s gives generous headroom for a cold page cache.
GXMAX_READY_TIMEOUT="${GXMAX_READY_TIMEOUT:-1800}"

# Shared memory for the container (32 GiB), and IPC/host networking, as verified.
GXMAX_SHM_BYTES="${GXMAX_SHM_BYTES:-34359738368}"

# ---------------------------------------------------------------------------
# Observability. This is the ONE additive change to the verified-working
# argument vector: --enable-metrics exposes SGLang's Prometheus gauges on
# /metrics, which the graceful-drain logic uses to detect in-flight requests.
# It does not touch the model, engine, parallelism or memory settings.
# Set to 0 to reproduce the original argument vector byte-for-byte.
# See coordination/DECISIONS.md -> D-002.
GXMAX_ENABLE_METRICS="${GXMAX_ENABLE_METRICS:-1}"

# ---------------------------------------------------------------------------
# HOST-RESILIENCE HARDENING (added 2026-09-14, after the gx10-02 mmap-thrash
# incident - coordination/BLOCKERS.md B-012). These are DOCKER `run` flags
# (gxmax_docker_flags in lib.sh), NOT part of the SGLang argument vector above
# - they do not touch the model, engine, --tp/--nnodes, or any SGLANG_*/B12X_*
# flag, so they are additive hardening, not a change to the locked config.
#
# On DGX Spark the cgroup cap is a BACKSTOP ONLY, and 2026-09-16 measurement
# showed it is a weaker one than even B-021 implied. B-021 established that
# the CUDA/unified-memory pool is not charged to the container cgroup. A
# deliberate test then lowered this cap to 28g -- below the measured 26.1 GiB
# working set plus driver memory -- and the container was NOT killed by its
# cgroup: node 2 still ran to 0 MiB MemAvailable and the kernel's GLOBAL OOM
# killer took the scheduler. So no --memory value bounds this workload, and
# none should be presented as if it does.
#
# Left at the 2026-09-14 verified-working value. It is a ceiling on the
# container's ordinary charged memory and nothing more. What actually protects
# the host is --oom-score-adj (below), which is verified to make SGLang the
# kernel's chosen victim rather than sshd/tailscaled/dockerd.
GXMAX_MEM_LIMIT="${GXMAX_MEM_LIMIT:-106g}"

# ---------------------------------------------------------------------------
# ADMISSION-GUARD RESERVE FOR GX-MAX (revised 2026-09-16, supersedes the
# 2026-09-15 B-017 "option 1" value of 5 GiB).
#
# The human operator has ruled that the 30 GiB MemAvailable floor is a
# REQUIREMENT for gx-max too, not an exception it is allowed to break, and
# has authorised runtime tuning (--mem-fraction-static, KV/context/CUDA-graph
# sizing) as the means to make the locked architecture fit inside it. The
# reserve is therefore the same 30 GiB every other tier gets; what changes to
# accommodate gx-max is the ENGINE's memory configuration, not the safety
# floor. See coordination/DECISIONS.md D-022 and BLOCKERS.md B-017/B-022.
GXMAX_GUARD_RESERVE_GIB="${GXMAX_GUARD_RESERVE_GIB:-30}"

# oom-score-adj: highest in the stack (see node01.yaml/node02.yaml for the
# 700/900 scale used elsewhere). If the WHOLE system is ever so short on
# memory that the kernel must pick a victim, gx-max - the single largest,
# most disposable-and-restartable process on the host - should die before
# sshd, tailscaled, systemd, NetworkManager, or the gateway/orchestrator.
GXMAX_OOM_SCORE_ADJ="${GXMAX_OOM_SCORE_ADJ:-950}"

# ===========================================================================
# RUNTIME MEMORY TUNING (added 2026-09-16, coordination/DECISIONS.md D-022)
# ---------------------------------------------------------------------------
# These are NOT locked architectural values. The locked set is: SGLang,
# nvidia/DeepSeek-V4-Flash-0731-NVFP4, --tp 2, --nnodes 2, rank0=gx10-01,
# rank1=gx10-02, no silent fallback. Everything below is engine tuning the
# operator has explicitly delegated, and it exists to make that locked
# architecture fit inside the 30 GiB MemAvailable floor.
#
# WHY THESE NUMBERS -- measured, not guessed:
#
#  * Node total (torch.cuda.mem_get_info, rank0 log): 124546 MiB = 121.63 GiB.
#  * Checkpoint on disk: 163.48 GiB across 48 shards (155.77 GiB of it MoE
#    expert weights). At --tp 2 each rank holds roughly half => ~82 GiB of
#    weights per rank BEFORE any KV cache, activations or CUDA graphs.
#  * The 2026-09-14 verified-working run used --mem-fraction-static 0.80,
#    i.e. a static pool of 0.80 x 121.63 = 97.3 GiB, and ended with
#    `available_gpu_mem=14.93 GB`. That run therefore left the node at
#    ~15 GiB free -- half the required floor. It worked, but it was never
#    compatible with a 30 GiB reserve.
#  * The 2026-09-15 attempt at the same 0.80 was globally OOM-killed during
#    weight loading (kernel log: `global_oom`, CONSTRAINT_NONE, victim
#    `sglang::schedul` oom_score_adj 950 -- our own flag correctly picking
#    gx-max as the victim). At kill time `free` was 855 MiB and ~93 GiB of
#    the node was held in NVIDIA-driver pages invisible to every LRU
#    counter -- the host-level corroboration of B-021.
#
# Each knob below therefore buys back node memory:
#   MEM_FRACTION_STATIC  0.80 -> value below: the single biggest lever.
#                        Every 0.01 is 1.22 GiB of node memory.
#   CONTEXT_LENGTH       327680 -> value below. A 320k context cannot be
#                        served out of the smaller KV pool anyway; claiming
#                        it would be exactly the "fake healthy state" this
#                        project forbids.
#   CHUNKED_PREFILL      8192 -> value below: halves prefill activation
#                        buffers (SGLANG_B12X_MAX_TOKENS is kept in step).
#   CUDA_GRAPH_MAX_BS    32 -> value below. SGLang's own startup log warns
#                        "heavy capture-pool memory pressure" for DSV4 and
#                        disables the prefill graph for that reason; the
#                        decode-graph tier is the part we control.
#   MAX_RUNNING_REQUESTS 32 -> value below, kept equal to the graph tier so
#                        no request class silently falls off the graph.
# ===========================================================================
GXMAX_MEM_FRACTION_STATIC="${GXMAX_MEM_FRACTION_STATIC:-0.70}"
GXMAX_CONTEXT_LENGTH="${GXMAX_CONTEXT_LENGTH:-32768}"
GXMAX_CHUNKED_PREFILL_SIZE="${GXMAX_CHUNKED_PREFILL_SIZE:-4096}"
GXMAX_CUDA_GRAPH_MAX_BS_DECODE="${GXMAX_CUDA_GRAPH_MAX_BS_DECODE:-8}"
GXMAX_MAX_RUNNING_REQUESTS="${GXMAX_MAX_RUNNING_REQUESTS:-8}"

# Off by default: mmap is what the 2026-09-14 verified-working run used, and
# the trough measurements say mapped-file pages are NOT the problem (node 2 at
# its 102 MiB trough held only 1.9 GiB Mapped and 2.0 GiB Cached against 26.2
# GiB of AnonPages). Disabling mmap would move weight data INTO that anonymous
# term, which is the one already under pressure. Left as a switch because it is
# a cheap thing to re-test if the loader's allocation behaviour ever changes.
GXMAX_DISABLE_WEIGHT_MMAP="${GXMAX_DISABLE_WEIGHT_MMAP:-0}"

# --load-format. THE lever for the load-phase peak, and the only one found
# that targets it directly. "auto" materialises the whole rank's weights
# through a large host-side staging step: measured 2026-09-16, that step is
# ~23-27 GiB of AnonPages on top of ~90 GiB of driver-held weights, which
# together is the entire 121.63 GiB node -- both nodes were driven to 0 MiB
# MemAvailable and the kernel's global OOM killer took the SGLang scheduler
# (correctly, per --oom-score-adj 950). "layered" loads and places one layer
# at a time, so the staging term is one layer rather than one rank.
# Empty string = leave the flag off entirely (SGLang's own "auto").
# Tested 2026-09-16, both rejected -- kept as switches, documented so nobody
# re-tries them blind:
#   layered        -> NotImplementedError: Cannot copy out of meta tensor
#                     (not supported for this NVFP4/DSV4 path)
#   runai_streamer -> loads, but the load-phase peak is UNCHANGED (node 1 still
#                     reached 437 MiB MemAvailable), so it does not help here.
# Empty = SGLang's own "auto", which is the verified-working behaviour.
GXMAX_LOAD_FORMAT="${GXMAX_LOAD_FORMAT:-}"

# Loader extra config. Empty when a --load-format that rejects these keys is
# selected; the default (auto) loader keeps the verified-working setting.
GXMAX_LOADER_EXTRA_CONFIG="${GXMAX_LOADER_EXTRA_CONFIG-{\"enable_multithread_load\":false\}}"

# ---------------------------------------------------------------------------
# FAILURE-UNWIND / DEADMAN (added 2026-09-16, coordination/BLOCKERS.md B-020)
#
# GXMAX_ABORT_FLOOR_GIB: the live sentinel in gx-max-start.sh aborts the
# launch and unwinds BOTH nodes if either node's real MemAvailable falls
# below this during startup. It is deliberately LOWER than the 30 GiB policy
# reserve: 30 is the steady-state requirement, this is the "stop before the
# kernel OOM killer does it for us" tripwire. A run whose minimum touches
# this number has failed its memory budget even if it would have come up.
# STEADY-STATE floor: enforced only once the engine answers /health.
GXMAX_ABORT_FLOOR_GIB="${GXMAX_ABORT_FLOOR_GIB:-20}"

# LOAD-PHASE floor: enforced while weights are still being loaded.
# MEASURED 2026-09-16, three real runs: loading one TP=2 rank of
# DeepSeek-V4-Flash drives a 121.63 GiB node to 1-8 GiB MemAvailable for
# ~60-120 s, and --mem-fraction-static does NOT change it (identical trough
# at 0.50 and 0.70). The trough is the model weights landing in
# NVIDIA-driver-held unified memory, which no /proc/meminfo LRU counter sees
# (B-021). Enforcing the steady-state reserve during that window aborts
# every launch -- it did, twice, before this split existed. 2 GiB is a
# last-resort tripwire: low enough to ride the known transient, high enough
# that THIS tooling tears the cluster down deliberately instead of leaving
# it to the kernel OOM killer. The real orphan protection during the load
# phase is rank-liveness (rank1-deadman.sh) plus --oom-score-adj 950, which
# is verified to make SGLang the kernel's chosen victim rather than sshd.
GXMAX_LOAD_FLOOR_GIB="${GXMAX_LOAD_FLOOR_GIB:-2}"
GXMAX_SENTINEL_POLL="${GXMAX_SENTINEL_POLL:-5}"

# Node-2-side deadman (rank1-deadman.sh). Startup grace covers the window in
# which rank1 is up and rank0 has legitimately not bound its bootstrap store
# yet; death grace is how long rank0 may be unreachable before rank1 removes
# itself rather than becoming an 80-minute orphan (B-020).
GXMAX_DEADMAN_STARTUP_GRACE="${GXMAX_DEADMAN_STARTUP_GRACE:-900}"
GXMAX_DEADMAN_DEATH_GRACE="${GXMAX_DEADMAN_DEATH_GRACE:-90}"
GXMAX_DEADMAN_POLL="${GXMAX_DEADMAN_POLL:-10}"
