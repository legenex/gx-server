# ============================================================================
# gx-max — LOCKED CONFIGURATION (V4.1: DeepSeek V4.1 Flash EXL3 via the Mia kit)
# ----------------------------------------------------------------------------
# The SGLang / llama-swap era is RETIRED (ARCHITECTURE-V41). There is ONE
# model now: DeepSeek-V4.1-Flash-EXL3-2.9bpw (uncensored), served by the Mia
# kit (mia-dsv41/, vLLM TP=2 over the ConnectX fabric, OpenAI API on the
# head node's :8888). The engine, topology and container names are LOCKED:
# never change the model family, the kit, TP=2, or the container names
# without an explicit human decision (ARCHITECTURE.md "Locked decisions").
#
# Every value is ${VAR:-default} so a caller can override it for a measurement
# or a test. That is NOT a licence to change the locked values in production.
# ============================================================================

# --- The engine (the Mia kit) -----------------------------------------------
# Where the kit lives. start.sh/stop.sh in that directory do everything
# (preflight, weights, image, launch of BOTH containers, health wait).
GXMAX_MIA_DIR="${GXMAX_MIA_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." >/dev/null 2>&1 && pwd)/mia-dsv41}"

# Containers (mia-dsv41/start.sh: CONTAINER_HEAD / CONTAINER_WORKER).
GXMAX_RANK0_NAME="${GXMAX_RANK0_NAME:-dsv41-exl3-head}"
GXMAX_RANK1_NAME="${GXMAX_RANK1_NAME:-dsv41-exl3-worker}"

# Serving endpoint (head node). vLLM's OpenAI API on loopback.
GXMAX_PORT="${GXMAX_PORT:-8888}"

# The model id vLLM must advertise on /v1/models. Verified against the live
# server before anything is called READY -- a proxy answering /health with
# the wrong id is a config fault, not a healthy engine.
GXMAX_SERVED_MODEL_ID="${GXMAX_SERVED_MODEL_ID:-DeepSeek-v4.1-Flash-EXL3}"

# Startup budget. The kit's cold boot (weight load + CUDA graph capture +
# warmup) measured ~25 minutes; 2400s gives headroom. The kit also has its
# own internal READY_TIMEOUT.
GXMAX_READY_TIMEOUT="${GXMAX_READY_TIMEOUT:-2400}"

# Logs
GXMAX_LOG_DIR="${GXMAX_LOG_DIR:-/srv/logs}"

# Management SSH target for node 2 (Tailscale = management plane only; model
# and NCCL traffic runs on the ConnectX fabric, L-3).
GXMAX_NODE2_SSH="${GXMAX_NODE2_SSH:-legenex-02@gx10-02}"

# Head node's fabric address (node 2 probes the API over the fabric, never
# over Tailscale).
GXMAX_HEAD_FABRIC_IP="${GXMAX_HEAD_FABRIC_IP:-192.168.100.10}"
GXMAX_HEALTH_URL_FROM_N2="${GXMAX_HEALTH_URL_FROM_N2:-http://${GXMAX_HEAD_FABRIC_IP}:${GXMAX_PORT}/health}"

# --- Profile overlay (registry-driven; defaults here are the 'balanced'
# profile from legenex/models/registry.json -- the orchestrator passes the
# real per-profile values through the environment; these are only the
# operator-facing fallbacks for a manual run.
GXMAX_PROFILE="${GXMAX_PROFILE:-balanced}"
SERVED_MODEL_NAME="${SERVED_MODEL_NAME:-${GXMAX_SERVED_MODEL_ID}}"
MAX_NUM_SEQS="${MAX_NUM_SEQS:-2}"
SPEC_METHOD="${SPEC_METHOD:-dspark}"
DSPARK_TOKENS="${DSPARK_TOKENS:-3}"
MAX_MODEL_LEN="${MAX_MODEL_LEN:-600000}"

# ===========================================================================
# ADMISSION + MEMORY POLICY (D-025) -- unchanged from the SGLang era: the
# engine still takes over BOTH nodes (~105 GiB resident per node), so the
# cluster-takeover admission and the live safety rules are model-agnostic.
# ===========================================================================
GXMAX_CLEAN_START_MIN_AVAIL_GIB="${GXMAX_CLEAN_START_MIN_AVAIL_GIB:-112}"
GXMAX_REQUIRED_SWAPFILE="${GXMAX_REQUIRED_SWAPFILE:-/swapfile-sglang}"
# The official DGX Spark notes measured ~36 GB peak swap per node during load.
GXMAX_MIN_SWAP_FREE_GIB="${GXMAX_MIN_SWAP_FREE_GIB:-40}"
GXMAX_MAX_PSI_FULL_AVG10="${GXMAX_MAX_PSI_FULL_AVG10:-5}"
# Startup transient envelope; monitored live by gx-max-safety.sh, never
# admitted against.
GXMAX_STARTUP_TRANSIENT_GIB="${GXMAX_STARTUP_TRANSIENT_GIB:-117}"
# Steady-state residency recorded in the resource-guard ledger.
GXMAX_STEADY_RESIDENCY_GIB="${GXMAX_STEADY_RESIDENCY_GIB:-105}"

# ---------------------------------------------------------------------------
# LIVE SAFETY (gx-max-safety.sh, node-local on BOTH nodes)
# Every rule is "held for N seconds" except kernel OOM and NV_ERR_NO_MEMORY.
# See gx-max-safety.sh for the rule set.
GXMAX_CRIT_AVAIL_MIB="${GXMAX_CRIT_AVAIL_MIB:-512}"
GXMAX_CRIT_SWAPFREE_MIB="${GXMAX_CRIT_SWAPFREE_MIB:-2048}"
GXMAX_EXHAUST_SUSTAIN_S="${GXMAX_EXHAUST_SUSTAIN_S:-30}"
GXMAX_THRASH_PSI_FULL="${GXMAX_THRASH_PSI_FULL:-40}"
GXMAX_THRASH_SWAPIN_PPS="${GXMAX_THRASH_SWAPIN_PPS:-4096}"
GXMAX_THRASH_SUSTAIN_S="${GXMAX_THRASH_SUSTAIN_S:-120}"
GXMAX_FORK_MAX_MS="${GXMAX_FORK_MAX_MS:-3000}"
GXMAX_MGMT_SUSTAIN_S="${GXMAX_MGMT_SUSTAIN_S:-60}"
GXMAX_STEADY_FLOOR_GIB="${GXMAX_STEADY_FLOOR_GIB:-4}"
GXMAX_STEADY_SUSTAIN_S="${GXMAX_STEADY_SUSTAIN_S:-60}"
GXMAX_SENTINEL_POLL="${GXMAX_SENTINEL_POLL:-5}"
# node 1 -> node 2 management reachability: abort if node 2 cannot be reached
# over SSH for this long (node 2's own deadman acts locally regardless).
GXMAX_N2_UNREACHABLE_ABORT_S="${GXMAX_N2_UNREACHABLE_ABORT_S:-180}"

# Node-2-side deadman (rank1-deadman.sh): startup grace covers the whole kit
# boot; death grace is how long the head may be unreachable before the
# worker removes itself rather than becoming an orphan (B-020).
GXMAX_DEADMAN_STARTUP_GRACE="${GXMAX_DEADMAN_STARTUP_GRACE:-1800}"
GXMAX_DEADMAN_DEATH_GRACE="${GXMAX_DEADMAN_DEATH_GRACE:-90}"
GXMAX_DEADMAN_POLL="${GXMAX_DEADMAN_POLL:-10}"
GXMAX_WATCH_POLL="${GXMAX_WATCH_POLL:-5}"
