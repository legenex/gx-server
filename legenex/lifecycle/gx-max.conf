# ============================================================================
# gx-max — LOCKED CONFIGURATION
# ----------------------------------------------------------------------------
# These values were captured from the VERIFIED-WORKING run of 2026-09-14 that
# started cleanly on both nodes and served real inference (see TEST_RESULTS.md).
#
# DO NOT change the engine (SGLang), the model, --tp, --nnodes, or any of the
# SGLANG_*/B12X_* environment variables without an explicit human decision.
# See ARCHITECTURE.md -> "Locked decisions".
# ============================================================================

GXMAX_IMAGE="lmsysorg/sglang:dev-v4f-2dgx-v2"

# Model path. Must exist at this SAME path on BOTH nodes.
GXMAX_MODEL_DIR="/srv/models/deepseek/DeepSeek-V4-Flash-0731-NVFP4"

# Distributed bootstrap. MUST be a ConnectX/RoCE address, never Tailscale.
GXMAX_DIST_ADDR="192.168.100.10:5000"

# Serving endpoint (node 1)
GXMAX_PORT="30000"

# Management SSH target for node 2 (Tailscale = management plane only).
GXMAX_NODE2_SSH="legenex-02@gx10-02"

# Container names
GXMAX_RANK0_NAME="gx-max-rank0"
GXMAX_RANK1_NAME="gx-max-rank1"

# Host cache dir (bind-mounted to /root/.cache) — holds the FlashInfer autotune
# cache. Keeping it warm saves ~2 minutes of startup.
GXMAX_CACHE_DIR="/var/tmp/sglang-cache"

# Logs
GXMAX_LOG_DIR="/srv/logs"

# Startup budget. A cold start measured 630s to "ready" (401s of that is weight
# loading). 1800s gives generous headroom for a cold page cache.
GXMAX_READY_TIMEOUT="1800"

# Shared memory for the container (32 GiB), and IPC/host networking, as verified.
GXMAX_SHM_BYTES="34359738368"

# ---------------------------------------------------------------------------
# Observability. This is the ONE additive change to the verified-working
# argument vector: --enable-metrics exposes SGLang's Prometheus gauges on
# /metrics, which the graceful-drain logic uses to detect in-flight requests.
# It does not touch the model, engine, parallelism or memory settings.
# Set to 0 to reproduce the original argument vector byte-for-byte.
# See coordination/DECISIONS.md -> D-002.
GXMAX_ENABLE_METRICS="1"

# ---------------------------------------------------------------------------
# HOST-RESILIENCE HARDENING (added 2026-09-14, after the gx10-02 mmap-thrash
# incident - coordination/BLOCKERS.md B-012). These are DOCKER `run` flags
# (gxmax_docker_flags in lib.sh), NOT part of the SGLang argument vector above
# - they do not touch the model, engine, --tp/--nnodes, or any SGLANG_*/B12X_*
# flag, so they are additive hardening, not a change to the locked config.
#
# Why gx-max is NOT capped down to leave the same 30 GiB reserve as the other
# tiers: gx-max is DOCUMENTED and LOCKED to take over the node (L-6, and
# node02.yaml's own budget note: rank1 alone holds ~93 GiB of this node's
# ~121.65 GiB). Capping it at ~91 GiB to force a 30 GiB floor would make it
# OOM-kill itself under its own verified-working footprint - that is exactly
# the "silent downgrade" this project's rules forbid, so it is not done
# unilaterally here. GXMAX_MEM_LIMIT is instead a generous ceiling ABOVE the
# documented ~93 GiB working set: a pure backstop against a pathological
# runaway (e.g. a leak) consuming the LITERAL entire node, including the small
# amount every other host process needs to keep running at all. It does not
# claim to satisfy "30 GiB reserved during normal operation" while gx-max is
# up - gx-max's own architecture treats that as an intentional, human-approved
# exception, not "normal operation" (it is never auto-started - see
# CURRENT_STATE.md / the human's explicit instruction not to touch this).
# If the 30 GiB floor must hold even during a gx-max run, that is an
# admission-control/architecture decision for a human, not something encoded
# here as a silent tightening.
GXMAX_MEM_LIMIT="106g"

# oom-score-adj: highest in the stack (see node01.yaml/node02.yaml for the
# 700/900 scale used elsewhere). If the WHOLE system is ever so short on
# memory that the kernel must pick a victim, gx-max - the single largest,
# most disposable-and-restartable process on the host - should die before
# sshd, tailscaled, systemd, NetworkManager, or the gateway/orchestrator.
GXMAX_OOM_SCORE_ADJ="950"
