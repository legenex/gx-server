# ============================================================================
# gx-max — LOCKED CONFIGURATION
# ----------------------------------------------------------------------------
# These values were captured from the VERIFIED-WORKING run of 2026-09-14 that
# started cleanly on both nodes and served real inference (see TEST_RESULTS.md).
#
# DO NOT change the engine (SGLang), the model, --tp, --nnodes, or any of the
# SGLANG_*/B12X_* environment variables without an explicit human decision.
# See ARCHITECTURE.md -> "Locked decisions".
#
# Every value here is written as ${VAR:-default} so a caller can override it
# for a measurement or a dry run. That is NOT a licence to change the locked
# values in production: the defaults below ARE the locked configuration, and
# anything overriding GXMAX_IMAGE / GXMAX_MODEL_DIR / the topology is doing a
# test, not running gx-max. Found necessary 2026-09-16: an unconditional
# assignment here silently overrode the environment, so a synthetic
# unwind test that set GXMAX_IMAGE to a 150 MB placeholder launched the real
# 33 GB SGLang image and the real 163 GiB model on both nodes instead.
# ============================================================================

GXMAX_IMAGE="${GXMAX_IMAGE:-lmsysorg/sglang:dev-v4f-2dgx-v2}"

# Model path. Must exist at this SAME path on BOTH nodes.
#
# D-032 (2026-09-17, human-approved model replacement): gx-max serves the
# uncensored dealignai/DeepSeek-V4-Flash-0731-CRACK-NVFP4 @ c66fe3848cb8. Its
# config.json and tensor index are byte-identical to the official
# deepseek-ai/DeepSeek-V4-Flash-0731 (native FP8 attention + FP4 experts), so
# it is served with the official SGLang cookbook cell for that checkpoint:
# dgx-spark / flash-official / fp4 (same image, same memory flags). The
# previous checkpoint (nvidia/...-NVFP4 @ f1caa7114, cell "nvfp4") stays on
# disk as the rollback: set both values below back to restore it.
GXMAX_MODEL_DIR="${GXMAX_MODEL_DIR:-/srv/models/deepseek/DeepSeek-V4-Flash-0731-CRACK}"

# SGLang cookbook quantization cell for GXMAX_MODEL_DIR: "fp4" (native
# DeepSeek FP4 checkpoints: b12x MoE runner) or "nvfp4" (NVIDIA ModelOpt
# NVFP4: flashinfer_cutlass + b12x draft runner + no shared-expert fusion).
GXMAX_QUANT_CELL="${GXMAX_QUANT_CELL:-fp4}"

# Distributed bootstrap. MUST be a ConnectX/RoCE address, never Tailscale.
GXMAX_DIST_ADDR="${GXMAX_DIST_ADDR:-192.168.100.10:5000}"

# Serving endpoint (node 1)
GXMAX_PORT="${GXMAX_PORT:-30000}"

# Management SSH target for node 2 (Tailscale = management plane only).
GXMAX_NODE2_SSH="${GXMAX_NODE2_SSH:-legenex-02@gx10-02}"

# Container names
GXMAX_RANK0_NAME="${GXMAX_RANK0_NAME:-gx-max-rank0}"
GXMAX_RANK1_NAME="${GXMAX_RANK1_NAME:-gx-max-rank1}"

# Host cache dir (bind-mounted to /root/.cache) — holds the FlashInfer autotune
# cache. Keeping it warm saves ~2 minutes of startup.
GXMAX_CACHE_DIR="${GXMAX_CACHE_DIR:-/var/tmp/sglang-cache}"

# Logs
GXMAX_LOG_DIR="${GXMAX_LOG_DIR:-/srv/logs}"

# Startup budget. A cold start measured 630s to "ready" (401s of that is weight
# loading). 1800s gives generous headroom for a cold page cache.
GXMAX_READY_TIMEOUT="${GXMAX_READY_TIMEOUT:-1800}"

# Shared memory for the container (32 GiB), and IPC/host networking, as verified.
GXMAX_SHM_BYTES="${GXMAX_SHM_BYTES:-34359738368}"

# ---------------------------------------------------------------------------
# Observability. This is the ONE additive change to the verified-working
# argument vector: --enable-metrics exposes SGLang's Prometheus gauges on
# /metrics, which the graceful-drain logic uses to detect in-flight requests.
# It does not touch the model, engine, parallelism or memory settings.
# Set to 0 to reproduce the original argument vector byte-for-byte.
# See coordination/DECISIONS.md -> D-002.
GXMAX_ENABLE_METRICS="${GXMAX_ENABLE_METRICS:-1}"

# ===========================================================================
# ENGINE MEMORY SETTINGS -- RESTORED TO THE VERIFIED-WORKING VALUES (D-025)
# ---------------------------------------------------------------------------
# These are byte-identical to commit 4b96e49 (the 2026-09-14 run that served
# real inference on these two nodes) AND to the current official SGLang
# cookbook cell `dgx-spark / flash-official / nvfp4 / balanced / multi-2`
# (sgl-project/sglang docs/src/snippets/configs/deepseek-ai/deepseek-v4.jsx,
# re-fetched 2026-09-16; unchanged since 2026-09-03).
#
# The 2026-09-16 "tuning" (0.70 / 32768 / 4096 / 8 / 8) is reverted, and not
# as a matter of taste: a TP=2 shard of this checkpoint is ~73% of a GB10
# node (SGLang's own "minimum viable = 0.731"), so 0.70 -- and the 0.50 that
# was also tried -- is below what can ever hold the weights plus any KV.
# Those runs were not evidence that gx-max does not fit; they were evidence
# that a swap-less container cannot absorb the load transient (see the
# GXMAX_MEM_LIMIT removal note below, and B-022's correction).
# ===========================================================================
GXMAX_MEM_FRACTION_STATIC="${GXMAX_MEM_FRACTION_STATIC:-0.80}"
GXMAX_CONTEXT_LENGTH="${GXMAX_CONTEXT_LENGTH:-327680}"
GXMAX_CHUNKED_PREFILL_SIZE="${GXMAX_CHUNKED_PREFILL_SIZE:-8192}"
GXMAX_CUDA_GRAPH_MAX_BS_DECODE="${GXMAX_CUDA_GRAPH_MAX_BS_DECODE:-32}"
GXMAX_MAX_RUNNING_REQUESTS="${GXMAX_MAX_RUNNING_REQUESTS:-32}"

# Loader behaviour, verified-working values. These three are NOT in the
# upstream cookbook cell; they are the documented DGX Spark mitigation for
# the load-time host-memory spike (the default 8-thread loader keeps ~10
# shards of host buffers in flight) and were part of the 4b96e49 launch.
GXMAX_DISABLE_WEIGHT_MMAP="${GXMAX_DISABLE_WEIGHT_MMAP:-0}"
GXMAX_LOAD_FORMAT="${GXMAX_LOAD_FORMAT:-}"
GXMAX_LOADER_EXTRA_CONFIG="${GXMAX_LOADER_EXTRA_CONFIG-{\"enable_multithread_load\":false\}}"

# ---------------------------------------------------------------------------
# CONTAINER MEMORY CAP -- REMOVED (D-025)
#
# 2026-09-15/16 runs used `--memory 106g --memory-swap 106g`. With Docker,
# --memory-swap equal to --memory sets the container's cgroup memory.swap.max
# to 0: the loader's ~26 GiB of anonymous staging pages could not be swapped
# out, so the node went to 0 MiB MemAvailable with 63 GiB of swap untouched
# and the kernel OOM-killed the scheduler. The 2026-09-14 verified run had no
# cap and used all 63 GiB of swap, then recovered and served. The cap never
# bounded the CUDA/unified-memory pool either (B-021). There is deliberately
# no replacement cap; gx-max-safety.sh polices the load live instead.
# ---------------------------------------------------------------------------

# oom-score-adj: highest in the stack. If the kernel must pick a victim,
# gx-max -- the largest, most restartable process -- dies before sshd,
# tailscaled, systemd, NetworkManager or the gateway. Verified 2026-09-16:
# both kernel OOM events chose `sglang::schedul`.
GXMAX_OOM_SCORE_ADJ="${GXMAX_OOM_SCORE_ADJ:-950}"

# ===========================================================================
# THREE-PHASE MEMORY POLICY (D-025)
# ---------------------------------------------------------------------------
# gx-max is an exclusive two-node takeover, not one more workload, so it does
# NOT use the ordinary `estimate + 30 GiB reserve <= node` admission (that
# formula is kept, unchanged, for every single-node tier). Instead:
#
# 1. PRE-LAUNCH CLEAN STATE (admission, both nodes, before rank1 starts):
#    both nodes drained, no other large/exclusive resident, node lock free,
#    /swapfile-sglang active, swap headroom, high MemAvailable, no existing
#    memory pressure, management plane healthy, deadman/unwind armed.
GXMAX_CLEAN_START_MIN_AVAIL_GIB="${GXMAX_CLEAN_START_MIN_AVAIL_GIB:-100}"
GXMAX_REQUIRED_SWAPFILE="${GXMAX_REQUIRED_SWAPFILE:-/swapfile-sglang}"
# The official DGX Spark notes measured ~36 GB peak swap per node during load.
GXMAX_MIN_SWAP_FREE_GIB="${GXMAX_MIN_SWAP_FREE_GIB:-40}"
GXMAX_MAX_PSI_FULL_AVG10="${GXMAX_MAX_PSI_FULL_AVG10:-5}"
#
# 2. STARTUP TRANSIENT ENVELOPE: ~117 GiB per node while weights stage.
#    Documented, monitored live by gx-max-safety.sh, never admitted against.
GXMAX_STARTUP_TRANSIENT_GIB="${GXMAX_STARTUP_TRANSIENT_GIB:-117}"
#
# 3. STEADY-STATE RESIDENCY: what the residency ledger records once serving.
GXMAX_STEADY_RESIDENCY_GIB="${GXMAX_STEADY_RESIDENCY_GIB:-105}"
# ===========================================================================

# ---------------------------------------------------------------------------
# LIVE SAFETY (gx-max-safety.sh, node-local on BOTH nodes)
#
# Replaces the old instantaneous GXMAX_LOAD_FLOOR_GIB=2 tripwire, which would
# have killed the 2026-09-14 verified-working launch (it touched ~1 GiB).
# Every rule is "held for N seconds" except kernel OOM and NV_ERR_NO_MEMORY.
# See gx-max-safety.sh for the rule set.
GXMAX_CRIT_AVAIL_MIB="${GXMAX_CRIT_AVAIL_MIB:-512}"
GXMAX_CRIT_SWAPFREE_MIB="${GXMAX_CRIT_SWAPFREE_MIB:-2048}"
GXMAX_EXHAUST_SUSTAIN_S="${GXMAX_EXHAUST_SUSTAIN_S:-30}"
GXMAX_THRASH_PSI_FULL="${GXMAX_THRASH_PSI_FULL:-40}"
GXMAX_THRASH_SWAPIN_PPS="${GXMAX_THRASH_SWAPIN_PPS:-4096}"
GXMAX_THRASH_SUSTAIN_S="${GXMAX_THRASH_SUSTAIN_S:-120}"
GXMAX_FORK_MAX_MS="${GXMAX_FORK_MAX_MS:-3000}"
GXMAX_MGMT_SUSTAIN_S="${GXMAX_MGMT_SUSTAIN_S:-60}"
GXMAX_STEADY_FLOOR_GIB="${GXMAX_STEADY_FLOOR_GIB:-4}"
GXMAX_STEADY_SUSTAIN_S="${GXMAX_STEADY_SUSTAIN_S:-60}"
GXMAX_SENTINEL_POLL="${GXMAX_SENTINEL_POLL:-5}"
# node 1 -> node 2 management reachability: abort if node 2 cannot be reached
# over SSH for this long (node 2's own deadman acts locally regardless).
GXMAX_N2_UNREACHABLE_ABORT_S="${GXMAX_N2_UNREACHABLE_ABORT_S:-180}"

# Node-2-side deadman (rank1-deadman.sh). Startup grace covers the window in
# which rank1 is up and rank0 has legitimately not bound its bootstrap store
# yet; death grace is how long rank0 may be unreachable before rank1 removes
# itself rather than becoming an 80-minute orphan (B-020).
GXMAX_DEADMAN_STARTUP_GRACE="${GXMAX_DEADMAN_STARTUP_GRACE:-900}"
GXMAX_DEADMAN_DEATH_GRACE="${GXMAX_DEADMAN_DEATH_GRACE:-90}"
GXMAX_DEADMAN_POLL="${GXMAX_DEADMAN_POLL:-10}"
# rank0 serves HTTP on node 1 only; node 2 must probe it over the fabric.
GXMAX_HEALTH_URL_FROM_N2="${GXMAX_HEALTH_URL_FROM_N2:-http://${GXMAX_DIST_ADDR%%:*}:${GXMAX_PORT}/health}"
